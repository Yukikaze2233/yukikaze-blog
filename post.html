<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>文章 · Yukikaze 的小站</title>
    <meta name="description" content="Yukikaze 的博客文章。">
    <link rel="icon" href="./static/img/favicon.ico">
    <link rel="stylesheet" href="./static/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="./static/vendor/github-dark.min.css">
    <link rel="stylesheet" href="./static/css/style.css">
</head>

<body>
    <div class="bg" aria-hidden="true"></div>
    <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
    <div class="layout layout--post">
        <aside class="sidebar sidebar--compact">
            <div class="avatar avatar--small" style="background-image: url('./static/img/logo.png');" aria-label="头像"></div>
            <a class="site-name site-name--link" href="./index.html">Yukikaze</a>
            <p class="site-bio">Robotics &amp; Computer Vision</p>
            <div class="socials">
                <a class="social-btn" href="https://github.com/Yukikaze2233" target="_blank" rel="noopener">GitHub</a>
                <a class="social-btn" href="mailto:yingziyuw@gmail.com">Email</a>
            </div>
            <a class="back-link" href="./index.html">← 返回首页</a>
        </aside>

        <main class="main post-main">
            <article class="post" id="post">
                <header class="post-header">
                    <h2 class="post-title" id="postTitle">加载中…</h2>
                    <div class="post-meta-line" id="postMeta"></div>
                </header>
                <div class="post-body" id="postBody">正在加载文章…</div>
                <div class="post-notfound" id="postNotFound" hidden>
                    <p>文章不存在，或地址不正确。</p>
                    <a class="back-link" href="./index.html">← 返回首页</a>
                </div>
            </article>
            <footer class="footer">Yukikaze © 2026 | たとえどんな現実を突きつけられようと、それでもと言い続けろ。自分を見失うな。—— マリーダ・クルス『機動戦士ガンダムUC』</footer>
        </main>
    </div>

    <script src="./static/vendor/markdown-it.min.js"></script>
    <script src="./static/vendor/highlight.min.js"></script>
    <script src="./static/vendor/katex/katex.min.js"></script>
    <script src="./static/vendor/katex/auto-render.min.js"></script>
    <script src="./static/js/script.js"></script>
</body>

</html>
